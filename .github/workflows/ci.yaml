name: Validate packages
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.4.4', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze lib test example tool
      - run: bash tool/generate_test_certificates.sh
      - run: dart test
      - run: python3 tool/check_structure.py
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example tool
      - if: matrix.sdk == 'stable'
        run: dart doc
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.4.4', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: dart pub get
      - run: node --test tool/run_browser_test_test.mjs
      - run: bash tool/verify_browser.sh
        env:
          # Only local fixtures run in this disposable hosted runner.
          CHROME_NO_SANDBOX: 'true'
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/flutter_client_factory_widgets
      - run: flutter pub get
        working-directory: packages/flutter_client_factory_widgets/example
      - run: flutter analyze lib test example/lib
        working-directory: packages/flutter_client_factory_widgets
      - run: flutter test
        working-directory: packages/flutter_client_factory_widgets
