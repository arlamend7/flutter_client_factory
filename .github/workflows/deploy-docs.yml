name: Deploy API documentation

on:
  workflow_run:
    workflows: [Validate packages]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/configure-pages@v5
      - run: dart pub get
      - run: dart doc --output build/site/core
      - run: flutter pub get
        working-directory: packages/flutter_client_factory_widgets
      - run: dart doc --output ../../build/site/widgets
        working-directory: packages/flutter_client_factory_widgets
      - run: cp tool/docs/index.html build/site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
