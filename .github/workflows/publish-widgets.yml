name: Publish Flutter adapter to pub.dev

on:
  push:
    tags: ['flutter_client_factory_widgets-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: publish-widgets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tool/verify_release_tag.py packages/flutter_client_factory_widgets
  validate:
    needs: check-tag
    uses: ./.github/workflows/ci.yaml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # setup-dart provisions the temporary pub.dev OIDC credential.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # A disposable copy avoids publishing/testing against checkout-only overrides.
      - name: Prepare package with hosted dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/widgets-release"
          tar --exclude=.dart_tool --exclude=build --exclude=.widget_preview --exclude=pubspec.lock --exclude=pubspec_overrides.yaml -cf - -C packages/flutter_client_factory_widgets . | tar -xf - -C "$RUNNER_TEMP/widgets-release"
      - run: flutter pub get
        working-directory: ${{ runner.temp }}/widgets-release
      - run: flutter pub get
        working-directory: ${{ runner.temp }}/widgets-release/example
      - run: flutter analyze lib test example/lib
        working-directory: ${{ runner.temp }}/widgets-release
      - run: flutter test
        working-directory: ${{ runner.temp }}/widgets-release
      - run: dart pub publish --dry-run
        working-directory: ${{ runner.temp }}/widgets-release
      - run: dart pub publish --force
        working-directory: ${{ runner.temp }}/widgets-release
