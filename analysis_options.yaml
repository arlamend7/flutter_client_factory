analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - curly_braces_in_flow_control_structures
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
